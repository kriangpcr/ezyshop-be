spring.application.name=ezyshop

spring.datasource.url=jdbc:postgresql://YOUR_HOST:5432/YOUR_DATABASE
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
spring.jpa.properties.hibernate.default_schema  = ezyshop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=YOUR_JWT_SECRET
jwt.expiration=3600000

supabase.url=https://YOUR_PROJECT.supabase.co
supabase.key=YOUR_SUPABASE_KEY
supabase.bucket=ezyshop