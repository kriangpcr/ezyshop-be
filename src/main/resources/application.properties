spring.config.import=optional:file:.env[.properties]
spring.application.name=ezyshop

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema  = ezyshop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.access_token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh_token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${BUCKET}

truewallet.mobile=${TRUE_WALLET}